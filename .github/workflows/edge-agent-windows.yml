# Builds + self-signs the Windows agent binary outside release.yml's signing
# gate (Azure Trusted Signing there needs LanternOps' own verified-business
# credentials, which this fork doesn't have). Signed with a self-issued
# "KResLab" code-signing cert instead — this does NOT earn SmartScreen
# reputation (that requires a CA-chained cert), but a machine that has the
# public KResLab cert installed in its Trusted Root/Trusted Publishers store
# (see the exported artifact below) will trust binaries signed with it with
# no SmartScreen prompt at all. Manual dispatch only — this isn't part of the
# normal release flow.
name: Edge Agent (Windows, self-signed)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-sign:
    name: Build + sign breeze-agent-windows-amd64.exe
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod

      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@v0.3.3

      - name: Embed version info + admin manifest (mirrors `make build-winres`, agent binary only)
        working-directory: agent/resources
        run: |
          go-winres simply --arch amd64 --no-suffix `
            --icon icon.ico --admin `
            --file-version 0.0.0 --product-version 0.0.0 `
            --product-name "Breeze" `
            --file-description "Breeze" `
            --copyright "Copyright (c) Breeze RMM" `
            --original-filename "breeze-agent.exe" `
            --out ../cmd/breeze-agent/rsrc_windows_amd64.syso

      # NOT admin (asInvoker) on purpose — this runs with the interactively
      # logged-in user's own token via CreateProcessAsUser, and an admin
      # manifest there fails with ELEVATION_REQUIRED (see service_cmd_windows.go
      # comments). Without this binary present, sessionbroker falls back to
      # spawning the (admin-manifested) main exe as the per-user helper, which
      # hits exactly that failure and leaves desktop capture broken.
      - name: Embed version info for breeze-user-helper.exe (asInvoker, not admin)
        working-directory: agent/resources
        run: |
          go-winres simply --arch amd64 --no-suffix `
            --icon icon.ico `
            --file-version 0.0.0 --product-version 0.0.0 `
            --product-name "Breeze RMM User Helper" `
            --file-description "Breeze RMM User Helper" `
            --copyright "Copyright (c) Breeze RMM" `
            --original-filename "breeze-user-helper.exe" `
            --out ../cmd/breeze-user-helper/rsrc_windows_amd64.syso

      # Watchdog supervises/recovers the agent service. Shipping our OWN signed
      # build (and downloading it as a sibling next to breeze-agent.exe in the
      # install command) means the agent never falls back to pulling the stock
      # watchdog from LanternOps' v0.5.0 GitHub release — keeps the whole stack
      # self-signed, self-hosted, and consistently branded ("Breeze", not
      # "Breeze RMM Watchdog"). admin manifest, same as the main agent.
      - name: Embed version info + admin manifest for breeze-watchdog.exe
        working-directory: agent/resources
        run: |
          go-winres simply --arch amd64 --no-suffix `
            --icon icon.ico --admin `
            --file-version 0.0.0 --product-version 0.0.0 `
            --product-name "Breeze" `
            --file-description "Breeze Helper" `
            --copyright "Copyright (c) Breeze RMM" `
            --original-filename "breeze-watchdog.exe" `
            --out ../cmd/breeze-watchdog/rsrc_windows_amd64.syso

      - name: Build agent, user-helper, and watchdog
        working-directory: agent
        env:
          GOOS: windows
          GOARCH: amd64
          # windows-latest auto-detects a C compiler and defaults CGO_ENABLED=1,
          # which pulls in internal/remote/desktop's cgo-tagged DXGI capture
          # path instead of the windows-&& !cgo one — that path isn't complete
          # in this checkout (undefined dxgiCapturer/comVtblFn/etc). Every
          # other build of this agent (release.yml's ubuntu-latest cross-
          # compile, the Makefile's local cross-compile) gets CGO_ENABLED=0
          # implicitly since there's no Windows C cross-compiler on those
          # hosts; force the same value here for a native windows-latest build.
          CGO_ENABLED: 0
        run: |
          go build -o bin/breeze-agent-windows-amd64.exe ./cmd/breeze-agent
          go build -ldflags "-H windowsgui" -o bin/breeze-user-helper-windows-amd64.exe ./cmd/breeze-user-helper
          go build -o bin/breeze-watchdog-windows-amd64.exe ./cmd/breeze-watchdog

      - name: Import KResLab code-signing cert
        env:
          PFX_BASE64: ${{ secrets.KRESLAB_CODESIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.KRESLAB_CODESIGN_PFX_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:PFX_BASE64)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\kreslab-codesign.pfx", $bytes)
          $securePw = ConvertTo-SecureString -String $env:PFX_PASSWORD -Force -AsPlainText
          Import-PfxCertificate -FilePath "$env:RUNNER_TEMP\kreslab-codesign.pfx" `
            -CertStoreLocation Cert:\CurrentUser\My -Password $securePw | Out-Null

      - name: Sign both exes
        run: |
          $cert = Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Subject -eq "CN=KResLab" } | Select-Object -First 1
          if (-not $cert) { throw "KResLab signing cert not found in CurrentUser\My store" }
          foreach ($f in @("agent\bin\breeze-agent-windows-amd64.exe", "agent\bin\breeze-user-helper-windows-amd64.exe", "agent\bin\breeze-watchdog-windows-amd64.exe")) {
            Set-AuthenticodeSignature -FilePath $f `
              -Certificate $cert -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com" | Out-Null
            $sig = Get-AuthenticodeSignature $f
            Write-Host "$f signature status: $($sig.Status) — signer: $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'UnknownError' -and $sig.Status -ne 'Valid' -and $sig.Status -ne 'NotTrusted') {
              throw "Unexpected signature status for $f`: $($sig.Status)"
            }
          }

      - name: Export public KResLab cert (for installing trust on branch PCs)
        run: |
          $cert = Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Subject -eq "CN=KResLab" } | Select-Object -First 1
          Export-Certificate -Cert $cert -FilePath kreslab-codesign-public.cer | Out-Null

      - uses: actions/upload-artifact@v4
        with:
          name: breeze-agent-windows-amd64-signed
          path: |
            agent/bin/breeze-agent-windows-amd64.exe
            agent/bin/breeze-user-helper-windows-amd64.exe
            agent/bin/breeze-watchdog-windows-amd64.exe
            kreslab-codesign-public.cer
          retention-days: 30
