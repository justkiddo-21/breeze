# Builds the Linux agent binary outside release.yml's signing gate. Linux needs
# no code signing, so this is a plain cross-arch-free build on ubuntu-latest —
# unlike the Windows edge workflow there is no cert/manifest step. Used to ship
# our fork's agent fixes (e.g. the X11 -displayfd display-resolution fix) to
# self-hosted Linux machines, which otherwise fall back to downloading upstream's
# unfixed binary via /api/v1/agents/download/linux/amd64.
name: Edge Agent (Linux)

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version baked into the binary via -X main.version (must be plain
          numeric semver, e.g. 0.116.1 — compareAgentVersions rejects a
          non-numeric core, and a `-suffix` sorts BELOW the plain version).
          This is the value the agent reports on heartbeat; it MUST match the
          VERSION registered for the served binary (the binaries-image VERSION
          file / BREEZE_VERSION) or the heartbeat upgrade check loops forever
          (target > reported stays true after every "successful" update).
        required: true
        default: "0.116.1"

permissions:
  contents: read

jobs:
  build:
    name: Build breeze-agent-linux-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod

      - name: Build breeze-agent-linux-amd64
        working-directory: agent
        env:
          GOOS: linux
          GOARCH: amd64
          # Matches every other build of this agent: the pure-Go X11 capture path
          # (internal/remote/desktop/x11) needs no cgo.
          CGO_ENABLED: 0
          AGENT_VERSION: ${{ inputs.version }}
        # -X main.version stamps the reported version. Omitting it (the old bug)
        # left the cmd/breeze-agent default "0.5.0" baked in, so every heartbeat
        # saw target > 0.5.0 and re-offered the update in an infinite loop. -s -w
        # mirrors build-edition.sh's self-host ldflags (this deployment serves the
        # self-host edition; no hostpolicy flags are needed).
        run: go build -ldflags "-s -w -X main.version=${AGENT_VERSION}" -o bin/breeze-agent-linux-amd64 ./cmd/breeze-agent

      # Bundle the OpenH264 encoder lib the agent needs for H264. It normally
      # auto-downloads this on first capture, but air-gapped kiosk machines can't
      # reach Cisco/GitHub — shipping it in our release (and placing it next to
      # the binary via the install command) means remote desktop works offline.
      # The exact filename is what encoder_openh264_dl_other.go searches for.
      - name: Fetch OpenH264 library
        working-directory: agent/bin
        run: |
          curl -fL --retry 3 -o libopenh264-2.4.1-linux64.7.so.bz2 \
            "http://ciscobinary.openh264.org/libopenh264-2.4.1-linux64.7.so.bz2"
          bunzip2 -f libopenh264-2.4.1-linux64.7.so.bz2
          file libopenh264-2.4.1-linux64.7.so

      - uses: actions/upload-artifact@v4
        with:
          name: breeze-agent-linux-amd64
          path: |
            agent/bin/breeze-agent-linux-amd64
            agent/bin/libopenh264-2.4.1-linux64.7.so
          retention-days: 30
