# Publishes a standalone API image on demand, mirroring edge-image-web.yml.
# release.yml's build-docker-api job is hard-gated behind release-integrity-gate
# (all macOS/Windows signing must succeed), which this fork cannot satisfy
# without LanternOps' code-signing secrets — so a tagged release here never
# reaches the docker-push jobs. This workflow publishes just the API image for
# self-host use without touching that gate.
#
# Staying current with upstream: the image is built from the CHECKED-OUT ref
# (normally the fork's `main`). The fork tracks lanternops/breeze by merging
# upstream/main into `main`; re-running this workflow after such a sync produces
# an API image carrying the latest upstream code plus the fork's changes. No
# per-sync edit to this file is needed — it builds whatever apps/api/Dockerfile
# is on the ref.
name: Edge API Image

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish-edge:
    name: Publish edge API image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api
          tags: |
            type=raw,value=edge
            type=sha,format=long,prefix=sha-

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=edge-api
          cache-to: type=gha,scope=edge-api,mode=max

      # Scan the exact pushed manifest for HIGH/CRITICAL CVEs. This edge image is
      # deployed to self-host production, so it gets the same blocking Trivy gate
      # as the other published images (dockerfileImageScanCoverage.test.ts).
      - name: Scan pushed edge API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api@${{ steps.build.outputs.digest }}
          severity: 'HIGH,CRITICAL'
          format: 'table'
          exit-code: '1'
